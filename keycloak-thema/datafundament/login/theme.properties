# Inlogthema van het Datafundament: dezelfde Utrecht-componenten, hetzelfde
# Haarlem-thema en dezelfde eigen tokens als het portaal (portaal/frontend/src/
# stijl.css). Gebaseerd op het thema van de Office Assistent (oa-uitrol). Bouwt
# voort op het basisthema van Keycloak: alleen de opmaak (template.ftl) en de
# pagina voor de code uit de app zijn eigen.
parent=base
locales=nl,en

# Het Haarlem-thema (NL Design System), daarna de tokens van het portaal.
styles=css/haarlem-theme.css css/utrecht.css css/df-tokens.css css/df-login.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=df-html
kcBodyClass=haarlem-theme df-thema utrecht-document df-login
kcLoginClass=df-pagina
kcFormCardClass=df-kaart

## Formulieren
kcFormClass=df-formulier
kcFormGroupClass=utrecht-form-field df-veld
kcFormGroupErrorClass=utrecht-form-field--invalid
kcLabelClass=utrecht-form-label
kcLabelWrapperClass=df-label
kcInputWrapperClass=df-invoer
kcInputClass=utrecht-textbox utrecht-textbox--html-input
kcTextareaClass=utrecht-textarea utrecht-textarea--html-textarea
kcInputGroup=df-invoergroep
kcInputErrorMessageClass=utrecht-form-field-error-message df-fout
kcInputHelperTextBeforeClass=utrecht-form-field-description
kcInputHelperTextAfterClass=utrecht-form-field-description
kcInputClassCheckbox=utrecht-form-field utrecht-form-field--checkbox
kcInputClassCheckboxInput=utrecht-checkbox utrecht-checkbox--html-input
kcInputClassCheckboxLabel=utrecht-form-label utrecht-form-label--checkbox
kcInputClassRadio=utrecht-form-field utrecht-form-field--radio
kcInputClassRadioInput=utrecht-radio-button utrecht-radio-button--html-input
kcInputClassRadioLabel=utrecht-form-label utrecht-form-label--radio
kcCheckboxInputClass=utrecht-checkbox utrecht-checkbox--html-input
kcFormSettingClass=df-opties
kcFormOptionsClass=df-opties
kcFormOptionsWrapperClass=df-opties-rij
kcFormButtonsClass=df-knoppen
kcFormButtonsWrapperClass=df-knoppen
kcContentWrapperClass=df-inhoud
kcMarginTopClass=df-ruimte-boven
kcSignUpClass=df-info
kcInfoAreaWrapperClass=df-info-tekst

## Knoppen
kcButtonClass=utrecht-button
kcButtonPrimaryClass=utrecht-button--primary-action
kcButtonDefaultClass=utrecht-button--secondary-action
kcButtonSecondaryClass=utrecht-button--secondary-action
kcButtonBlockClass=
kcButtonLargeClass=

## Wachtwoord tonen (iconen zitten in df-login.css)
kcFormPasswordVisibilityButtonClass=df-oog-knop
kcFormPasswordVisibilityIconShow=df-oog
kcFormPasswordVisibilityIconHide=df-oog df-oog--dicht

## Meldingen
kcAlertClass=utrecht-alert
kcAlertTitleClass=utrecht-alert__message
kcFeedbackErrorIcon=df-melding-icoon
kcFeedbackWarningIcon=df-melding-icoon
kcFeedbackSuccessIcon=df-melding-icoon
kcFeedbackInfoIcon=df-melding-icoon
kcResetFlowIcon=df-opnieuw

## Andere manieren van inloggen (bijvoorbeeld Entra ID, later)
kcFormSocialAccountSectionClass=df-anders
kcFormSocialAccountListClass=df-anders-lijst
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=utrecht-button utrecht-button--secondary-action df-knop-breed
kcFormSocialAccountListButtonDisabledClass=utrecht-button--disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
kcSelectAuthListClass=df-keuzelijst
kcSelectAuthListItemClass=df-keuzelijst-item

## Herstelcodes en de keuze tussen apps (docs/inloggen-herstel.md)
kcRecoveryCodesWarning=df-herstel-waarschuwing
kcRecoveryCodesList=df-herstelcodes
kcRecoveryCodesActions=df-herstel-knoppen
kcCheckInputClass=utrecht-checkbox utrecht-checkbox--html-input

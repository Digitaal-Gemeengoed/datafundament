# Rechten in Trino (DF-ADR-017): een JSON-bestand met regels, geschreven door het
# portaal uit de toekenningen (portaal/backend/src/trinoregels.ts). Trino leest
# het elke minuut opnieuw. Zonder regel mag niemand iets.
access-control.name=file
security.config-file=/etc/trino/regels/rules.json
security.refresh-period=1m

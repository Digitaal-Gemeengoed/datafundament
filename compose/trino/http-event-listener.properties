# Elke datavraag vastleggen (DF-ADR-016): na elke query stuurt Trino een
# QueryCompletedEvent naar de ontvanger in het portaal (interne poort 4301, niet
# via Caddy), met een gedeeld token. Lukt dat niet, dan probeert Trino het opnieuw.
event-listener.name=http
http-event-listener.log-created=false
http-event-listener.log-completed=true
http-event-listener.connect-ingest-uri=http://portaal:4301/trino/gebeurtenis
http-event-listener.connect-http-headers=X-Datavragen-Token:${ENV:DATAVRAGEN_TOKEN}
http-event-listener.connect-retry-count=5
http-event-listener.connect-retry-delay=2s

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Achter Caddy (HTTPS): de adressen die Trino teruggeeft, krijgen https.
http-server.process-forwarded=true
query.max-memory=4GB
query.max-memory-per-node=2GB
# Inloggen via Keycloak (DF-ADR-017): mensen met OAuth2 (web-UI, en JDBC of CLI
# met externalAuthentication=true); de gebruiker is hun e-mailadres. Diensten
# (OpenMetadata) met een wachtwoord uit wachtwoorden.db. TLS doet Caddy;
# process-forwarded hierboven laat Trino dat zien.
http-server.authentication.type=oauth2,password
http-server.authentication.oauth2.issuer=https://id.${ENV:DOMEIN}/realms/datafundament
http-server.authentication.oauth2.client-id=df-trino
http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_GEHEIM}
http-server.authentication.oauth2.scopes=openid,email
http-server.authentication.oauth2.principal-field=email
internal-communication.shared-secret=${ENV:TRINO_INTERN_GEHEIM}
web-ui.authentication.type=oauth2
# Wie wat mag: de regels die het portaal schrijft (DF-ADR-017).
access-control.config-files=/etc/trino/access-control.properties
# Elke datavraag naar het portaal (DF-ADR-016).
event-listener.config-files=/etc/trino/http-event-listener.properties

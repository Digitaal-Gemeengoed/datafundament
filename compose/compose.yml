# Het platform op dfc (DF-ADR-009): de kern van het lakehouse.
#
#   Garage (S3)         objectopslag, een eigen sleutel per onderdeel (DF-ADR-002);
#                       de bucket 'landing' is via WireGuard bereikbaar voor dfw (DF-ADR-014)
#   db                  PostgreSQL met PostGIS: Lakekeeper, Dagster en het datawarehouse (dwh)
#   Lakekeeper          Iceberg REST-catalogus (DF-ADR-003)
#   Trino               de enige voordeur voor afnemers (DF-ADR-008)
#   werk                de code: ingestie (dlt) en transformatie (dbt); code server voor Dagster
#   Dagster             webserver en daemon: de regisseur
#   Keycloak            inloggen (DF-ADR-012), op id.<domein>
#   portaal             het portaal: platform, dataproducten, toegang, verwijderen (DF-ADR-013)
#   OpenMetadata        de catalogus, met OpenSearch als zoekindex, op metadata.<domein>;
#                       de ingestie draait als job in Dagster, zonder Airflow (DF-ADR-007)
#   Caddy               TLS en de enige ingang; de onderdelen nog met één wachtwoord
#
# Installeren en bijwerken: sudo /opt/datafundament/server/installeer-platform.sh
# Versies zijn vastgepind; zie proeven/iceberg-schrijfpad (DF-ADR-004).

name: datafundament

x-werk-omgeving: &werk-omgeving
  DAGSTER_PG_USER: dagster
  DAGSTER_PG_PASSWORD: ${DAGSTER_DB_WACHTWOORD:?}
  # De bron op dfw, via WireGuard (DF-ADR-006), en de Zaken-API daar (DF-ADR-014).
  BRON_HOST: 10.67.0.2
  DLT_WACHTWOORD: ${DLT_WACHTWOORD:?}
  ZAKEN_API_URL: http://10.67.0.2:8000
  ZAKEN_API_GEHEIM: ${ZAKEN_API_GEHEIM:?}
  # De kluis (DF-ADR-015): de HMAC van een BSN komt van OpenBao op dfw (de sleutel
  # verlaat die nooit); de koppelingen pseudoniem ↔ HMAC staan in een eigen database.
  KLUIS_BAO_ADRES: http://10.67.0.2:8200
  KLUIS_BAO_TOKEN: ${KLUIS_BAO_TOKEN_INGESTIE:?}
  KLUIS_DSN: host=db dbname=kluis user=kluis password=${KLUIS_DB_WACHTWOORD:?}
  # dlt schrijft Iceberg in Garage, met de sleutel van de schrijvers.
  DESTINATION__FILESYSTEM__BUCKET_URL: s3://lakehouse/warehouse/dlt
  DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${GARAGE_SCHRIJVER_SLEUTEL:?}
  DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${GARAGE_SCHRIJVER_GEHEIM:?}
  DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: http://garage:3900
  DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: garage
  DESTINATION__FILESYSTEM__CREDENTIALS__S3_URL_STYLE: path
  ICEBERG_CATALOG__ICEBERG_CATALOG_TYPE: rest
  # pyiceberg (voor dlt): Lakekeeper als catalogus "default".
  PYICEBERG_CATALOG__DEFAULT__TYPE: rest
  PYICEBERG_CATALOG__DEFAULT__URI: http://lakekeeper:8181/catalog
  PYICEBERG_CATALOG__DEFAULT__WAREHOUSE: datafundament
  PYICEBERG_CATALOG__DEFAULT__S3__ENDPOINT: http://garage:3900
  PYICEBERG_CATALOG__DEFAULT__S3__ACCESS_KEY_ID: ${GARAGE_SCHRIJVER_SLEUTEL}
  PYICEBERG_CATALOG__DEFAULT__S3__SECRET_ACCESS_KEY: ${GARAGE_SCHRIJVER_GEHEIM}
  PYICEBERG_CATALOG__DEFAULT__S3__REGION: garage
  # dbt (transformatie/profiles.yml): DuckDB schrijft Iceberg met dezelfde sleutel,
  # en dataproducten in het datawarehouse (PostGIS).
  GARAGE_SCHRIJVER_SLEUTEL: ${GARAGE_SCHRIJVER_SLEUTEL}
  GARAGE_SCHRIJVER_GEHEIM: ${GARAGE_SCHRIJVER_GEHEIM}
  DWH_SCHRIJVER_WACHTWOORD: ${DWH_SCHRIJVER_WACHTWOORD:?}
  # OpenMetadata bijwerken (orkestratie/metadata.py): het token van de ingestion-bot.
  # Leeg tot je het hebt gezet met server/metadata-token.sh; de job slaat dan over.
  OPENMETADATA_BOT_TOKEN: ${OPENMETADATA_BOT_TOKEN:-}
  # OpenMetadata leest Trino via Caddy (HTTPS), als dienstgebruiker (DF-ADR-017).
  DOMEIN: ${DOMEIN:?}
  TRINO_OM_WACHTWOORD: ${TRINO_OM_WACHTWOORD:?}

# OpenMetadata (DF-ADR-007): inloggen via Keycloak, de database in db, OpenSearch
# als zoekindex. Zonder Airflow: PIPELINE_SERVICE_CLIENT_ENABLED staat uit.
# Eigen RSA-sleutels voor de tokens (de sleutels in het image zijn openbaar) en
# een eigen Fernet-sleutel; beide maakt het installatiescript.
x-om-omgeving: &om-omgeving
  OPENMETADATA_CLUSTER_NAME: datafundament
  SERVER_HOST_API_URL: http://openmetadata:8585/api
  OPENMETADATA_SERVER_URL: https://metadata.${DOMEIN}
  OPENMETADATA_HEAP_OPTS: -Xmx2G -Xms1G
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: sslmode=disable
  DB_HOST: db
  DB_PORT: "5432"
  OM_DATABASE: openmetadata
  DB_USER: openmetadata
  DB_USER_PASSWORD: ${OM_DB_WACHTWOORD:?}
  SEARCH_TYPE: opensearch
  ELASTICSEARCH_HOST: zoekindex
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"
  FERNET_KEY: ${OM_FERNET_SLEUTEL:?}
  RSA_PUBLIC_KEY_FILE_PATH: /opt/openmetadata/conf/df/public_key.der
  RSA_PRIVATE_KEY_FILE_PATH: /opt/openmetadata/conf/df/private_key.der
  JWT_ISSUER: metadata.${DOMEIN}
  JWT_KEY_ID: ${OM_JWT_SLEUTEL_ID:?}
  AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
  AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
  # De beheerder: het deel vóór de @ van het e-mailadres in Keycloak (server/keycloak.sh).
  AUTHORIZER_ADMIN_PRINCIPALS: "[${OM_BEHEERDER:-admin}]"
  AUTHORIZER_PRINCIPAL_DOMAIN: ${OM_DOMEIN:-haarlem.nl}
  AUTHENTICATION_PROVIDER: custom-oidc
  CUSTOM_OIDC_AUTHENTICATION_PROVIDER_NAME: Keycloak
  AUTHENTICATION_CLIENT_TYPE: confidential
  AUTHENTICATION_AUTHORITY: https://id.${DOMEIN}/realms/datafundament
  AUTHENTICATION_CLIENT_ID: df-metadata
  AUTHENTICATION_CALLBACK_URL: https://metadata.${DOMEIN}/callback
  AUTHENTICATION_PUBLIC_KEYS: "[https://id.${DOMEIN}/realms/datafundament/protocol/openid-connect/certs,http://openmetadata:8585/api/v1/system/config/jwks]"
  AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
  FORCE_SECURE_SESSION_COOKIE: "true"
  OIDC_TYPE: Keycloak
  OIDC_CLIENT_ID: df-metadata
  OIDC_CLIENT_SECRET: ${OM_OIDC_GEHEIM:-nog-niet-gezet}
  OIDC_DISCOVERY_URI: https://id.${DOMEIN}/realms/datafundament/.well-known/openid-configuration
  OIDC_CALLBACK: https://metadata.${DOMEIN}/callback
  OIDC_SERVER_URL: https://metadata.${DOMEIN}

x-werk-volumes: &werk-volumes
  - ./dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
  - ./dagster/workspace.yaml:/opt/dagster/workspace.yaml:ro
  - dagsteropslag:/opt/dagster/home/storage
  - dltstaat:/var/lib/dlt
  # De uitkomst van dbt, voor OpenMetadata (orkestratie/metadata.py).
  - dbtuitvoer:/var/lib/dbt

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: beheer
      POSTGRES_PASSWORD: ${DB_WACHTWOORD:?}
      # Voor db/20-datafundament.sh: de rollen per onderdeel.
      LK_DB_WACHTWOORD: ${LK_DB_WACHTWOORD:?}
      DAGSTER_DB_WACHTWOORD: ${DAGSTER_DB_WACHTWOORD}
      DWH_SCHRIJVER_WACHTWOORD: ${DWH_SCHRIJVER_WACHTWOORD}
      DWH_LEZER_WACHTWOORD: ${DWH_LEZER_WACHTWOORD:?}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Als los bestand, zodat het init-script van PostGIS zelf blijft draaien.
      - ./db/20-datafundament.sh:/docker-entrypoint-initdb.d/20-datafundament.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beheer -d postgres"]
      interval: 5s
      retries: 30

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    # Eén node zonder replicatie; de back-up is de tweede kopie. De standaardsleutel
    # is die van beheer; de sleutels per onderdeel zet installeer-platform.sh erbij.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_GEHEIM:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_BEHEER_SLEUTEL:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_BEHEER_GEHEIM:?}
      GARAGE_DEFAULT_BUCKET: lakehouse
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      # Alleen voor dfw, via WireGuard: de leverancier zet zijn export in de bucket
      # 'landing', met een sleutel die alleen mag schrijven (DF-ADR-014).
      - "${WG_ADRES:-10.67.0.1}:3900:3900"

  lakekeeper-migratie:
    image: &lakekeeper vakamo/lakekeeper@sha256:e5a0e9d3ffecf0c09b2c0bcd2258e9adc2274bf88c1127b2ca08ea02966b5f48
    command: ["migrate"]
    environment: &lakekeeper-omgeving
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LK_DB_WACHTWOORD}@db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LK_DB_WACHTWOORD}@db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LK_SLEUTEL:?}
      # Nog zonder inlog; alleen bereikbaar binnen dit netwerk en via Caddy met wachtwoord.
      # Keycloak en rechten per gebruiker volgen (DF-ADR-012).
      LAKEKEEPER__AUTHZ_BACKEND: allowall
    depends_on:
      db: { condition: service_healthy }

  lakekeeper:
    image: *lakekeeper
    restart: unless-stopped
    command: ["serve"]
    environment: *lakekeeper-omgeving
    depends_on:
      lakekeeper-migratie: { condition: service_completed_successfully }
      garage: { condition: service_started }

  trino:
    image: trinodb/trino@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    restart: unless-stopped
    # De heap van Trino is 80% van deze grens.
    mem_limit: 8g
    environment:
      GARAGE_LEZER_SLEUTEL: ${GARAGE_LEZER_SLEUTEL:?}
      GARAGE_LEZER_GEHEIM: ${GARAGE_LEZER_GEHEIM:?}
      DWH_LEZER_WACHTWOORD: ${DWH_LEZER_WACHTWOORD}
      DATAVRAGEN_TOKEN: ${DATAVRAGEN_TOKEN:?}
      # Inloggen via Keycloak en de interne sleutel (DF-ADR-017).
      DOMEIN: ${DOMEIN:?}
      TRINO_OIDC_GEHEIM: ${TRINO_OIDC_GEHEIM:-nog-niet-gezet}
      TRINO_INTERN_GEHEIM: ${TRINO_INTERN_GEHEIM:?}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/http-event-listener.properties:/etc/trino/http-event-listener.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      # Geschreven door het portaal en het installatiescript; hier alleen lezen.
      - ./trino/regels:/etc/trino/regels:ro
      - ./trino/wachtwoorden:/etc/trino/wachtwoorden:ro
      - ../datahub/trino/catalog:/etc/trino/catalog:ro
    depends_on: [lakekeeper, db]

  # De code als gRPC-server voor Dagster; runs draaien ook hier.
  werk:
    build:
      context: ..
      dockerfile: werk/Dockerfile
    image: datafundament-werk
    pull_policy: build
    restart: unless-stopped
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "orkestratie.definitions"]
    environment: *werk-omgeving
    volumes: *werk-volumes
    depends_on:
      db: { condition: service_healthy }
      lakekeeper: { condition: service_started }

  dagster-webserver:
    image: datafundament-werk
    # Zelf gebouwd (dienst werk); nooit ophalen.
    pull_policy: never
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/workspace.yaml"]
    environment: *werk-omgeving
    volumes: *werk-volumes
    depends_on: [werk]

  dagster-daemon:
    image: datafundament-werk
    # Zelf gebouwd (dienst werk); nooit ophalen.
    pull_policy: never
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/workspace.yaml"]
    environment: *werk-omgeving
    volumes: *werk-volumes
    depends_on: [werk]

  # Inloggen (DF-ADR-012). Realm, client en eerste gebruiker: server/keycloak.sh.
  # Het beheerscherm is van buiten dicht; via een SSH-tunnel op http://localhost:8088/admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_WACHTWOORD:?}
      KC_HOSTNAME: https://id.${DOMEIN:?}
      KC_HOSTNAME_ADMIN: http://localhost:8088
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: beheer
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BEHEERDER_WACHTWOORD:?}
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      db: { condition: service_healthy }

  # Het portaal (DF-ADR-013), op het fundament van oa-beheer. Eerst de migraties
  # en het hoofdaccount, als eigenaar van de database; daarna het portaal zelf.
  portaal-migreer:
    build: ../portaal
    image: datafundament-portaal
    pull_policy: build
    command: ["node", "backend/dist/cli.js", "migreer"]
    environment: &portaal-omgeving
      BEHEER_HOST: admin.${DOMEIN}
      ADMIN_SECRET: ${PORTAAL_ADMIN_GEHEIM:?}
      DATABASE_URL: postgres://df_portaal_app:${PORTAAL_APP_WACHTWOORD:?}@db:5432/df_portaal
      DATABASE_URL_EIGENAAR: postgres://df_portaal:${PORTAAL_DB_WACHTWOORD:?}@db:5432/df_portaal
      HOOFDACCOUNT_EMAIL: ${PORTAAL_HOOFDACCOUNT:-beheer@${DOMEIN}}
      # Leeg tot server/keycloak.sh heeft gedraaid; dan werkt alleen /emergency.
      OIDC_ISSUER: ${PORTAAL_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: df-portaal
      OIDC_CLIENT_SECRET: ${PORTAAL_OIDC_GEHEIM:-}
      KLUIS_BAO_ADRES: http://10.67.0.2:8200
      KLUIS_BAO_TOKEN: ${KLUIS_BAO_TOKEN_PORTAAL:?}
      # De ontvanger van Trino (DF-ADR-016), op poort 4301 binnen het compose-netwerk.
      DATAVRAGEN_TOKEN: ${DATAVRAGEN_TOKEN:?}
      DAGSTER_URL: http://dagster-webserver:3000
      DAGSTER_LOCATIE: datafundament
      LAKEKEEPER_URL: http://lakekeeper:8181
      # De regels voor Trino (DF-ADR-017), uit de toekenningen en het manifest van dbt.
      TRINO_REGELS_PAD: /var/lib/trino-regels/rules.json
      DBT_MANIFEST: /var/lib/dbt/laatste/manifest.json
      OPENMETADATA_URL: http://openmetadata:8585
      TRINO_URL: http://trino:8080
      GARAGE_URL: http://garage:3903
      # Uitnodigingen en meldingen. Zonder SMTP_HOST schrijft het portaal alleen in
      # zijn log dat er een e-mail niet is verstuurd.
      SMTP_HOST: ${SMTP_HOST:-}
      # Inlogaccounts in Keycloak beheren (uitnodiging, herstel), via het compose-netwerk.
      KEYCLOAK_INTERN: http://keycloak:8080
      SMTP_POORT: ${SMTP_POORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_GEBRUIKER: ${SMTP_GEBRUIKER:-}
      SMTP_WACHTWOORD: ${SMTP_WACHTWOORD:-}
      SMTP_AFZENDER: ${SMTP_AFZENDER:-}
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  portaal:
    image: datafundament-portaal
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *portaal-omgeving
    volumes:
      # Het portaal schrijft de regels voor Trino; het manifest van dbt zegt welke
      # kolommen gevoelig zijn (DF-ADR-017).
      - ./trino/regels:/var/lib/trino-regels
      - dbtuitvoer:/var/lib/dbt:ro
    depends_on:
      portaal-migreer: { condition: service_completed_successfully }

  # De zoekindex van OpenMetadata. Alleen binnen het compose-netwerk; beveiliging
  # uit, want alleen OpenMetadata praat ermee. Vraagt vm.max_map_count=262144 op
  # de host (zet het installatiescript).
  zoekindex:
    image: opensearchproject/opensearch:3.4.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      indices.query.bool.max_clause_count: "4096"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 2g
    volumes:
      - zoekdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      retries: 20

  openmetadata-migratie:
    image: docker.getcollate.io/openmetadata/server:2.1.1
    restart: "no"
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    environment: *om-omgeving
    volumes:
      - ./openmetadata:/opt/openmetadata/conf/df:ro
    depends_on:
      db: { condition: service_healthy }
      zoekindex: { condition: service_healthy }

  openmetadata:
    image: docker.getcollate.io/openmetadata/server:2.1.1
    restart: unless-stopped
    environment: *om-omgeving
    volumes:
      - ./openmetadata:/opt/openmetadata/conf/df:ro
    mem_limit: 3g
    depends_on:
      openmetadata-migratie: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8586/healthcheck || curl -sf http://localhost:8586/healthcheck"]
      interval: 15s
      retries: 40

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMEIN: ${DOMEIN:?}
      WEB_GEBRUIKER: ${WEB_GEBRUIKER:?}
      WEB_WACHTWOORD_HASH: ${WEB_WACHTWOORD_HASH:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/start:/srv/start:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [dagster-webserver, trino, lakekeeper, portaal, keycloak]

volumes:
  dbdata:
  garagemeta:
  garagedata:
  dagsteropslag:
  dltstaat:
  caddydata:
  caddyconfig:
  zoekdata:
  dbtuitvoer:

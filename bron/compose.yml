# De bron op dfw: PostgreSQL met de testpersonen uit vrijBRP (DF-ADR-010), met
# logische replicatie voor CDC (DF-ADR-006). Alleen bereikbaar via WireGuard,
# en alleen voor dfc (pg_hba.conf en het poortfilter, DF-ADR-009).
#
# Daarnaast de Zaken-API van het (synthetische) zaaksysteem (DF-ADR-014) en de
# kluis: OpenBao met de sleutel voor pseudoniemen (DF-ADR-015).
#
# Bedienen met ./bron.sh (zie ./bron.sh help).

name: df-bron

services:
  db:
    image: postgres:${POSTGRES_VERSIE:-17}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # Een replicatieslot dat niemand leest, houdt WAL vast. Hier stopt dat bij 2 GB,
      # zodat de schijf niet volloopt als dfc een tijd niet leest.
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
    environment:
      POSTGRES_USER: bron
      POSTGRES_PASSWORD: ${BRON_WACHTWOORD:?}
      POSTGRES_DB: bron
      # Voor sql/01-rollen.sh: het wachtwoord van de leesgebruiker voor dlt op dfc.
      DLT_WACHTWOORD: ${DLT_WACHTWOORD:?}
    volumes:
      - bronpg:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      # Alleen op het WireGuard-adres. Lokaal (laptop): WG_ADRES=127.0.0.1 in .env.
      - "${WG_ADRES:-10.67.0.2}:5432:5432"
    networks: [bron]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bron -d bron"]
      interval: 5s
      retries: 30

  # Laden, muteren, simuleren en exporteren (brp.py). Draait alleen op verzoek:
  # ./bron.sh <opdracht>, of elk uur via de timer van de simulatie.
  werkbank:
    build: ./werkbank
    image: df-bron-werkbank
    profiles: [werk]
    environment:
      PGHOST: db
      PGUSER: bron
      PGPASSWORD: ${BRON_WACHTWOORD}
      PGDATABASE: bron
      ZAKEN_API_DB_WACHTWOORD: ${ZAKEN_API_DB_WACHTWOORD:-}
      # Nachtelijke export naar de landingsbucket op dfc (sleutel mag alleen schrijven).
      LANDING_ENDPOINT: ${LANDING_ENDPOINT:-http://10.67.0.1:3900}
      LANDING_SLEUTEL: ${LANDING_SLEUTEL:-}
      LANDING_GEHEIM: ${LANDING_GEHEIM:-}
    volumes:
      - testdata:/data
    networks: [bron]
    depends_on:
      db: { condition: service_healthy }

  # De Zaken-API (ZGW-achtig, alleen lezen), voor dfc via WireGuard.
  zaken-api:
    image: df-bron-werkbank
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["uvicorn", "zaken_api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      PGHOST: db
      PGUSER: zaken_api
      PGPASSWORD: ${ZAKEN_API_DB_WACHTWOORD:?}
      PGDATABASE: bron
      ZAKEN_API_GEHEIM: ${ZAKEN_API_GEHEIM:?}
      BASIS_URL: http://${WG_ADRES:-10.67.0.2}:8000
    ports:
      - "${WG_ADRES:-10.67.0.2}:8000:8000"
    networks: [bron]
    depends_on:
      db: { condition: service_healthy }

  # De kluis: OpenBao met de sleutel voor de HMAC van een BSN (DF-ADR-015). Bewust
  # op dfw, niet naast het lakehouse en de pseudoniemen op dfc. De sleutel verlaat
  # OpenBao nooit; dfc vraagt alleen om een HMAC. Na elke herstart: ontzegelen
  # (./bron.sh kluis-ontzegel). Eerste keer: ./bron.sh kluis-inrichten.
  kluis:
    image: quay.io/openbao/openbao:2.7.2
    restart: unless-stopped
    # "server" laadt zelf alles uit /openbao/config.
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/beleid-hmac.hcl:/openbao/beleid/beleid-hmac.hcl:ro
      - baodata:/openbao/file
      - baologs:/openbao/logs
    ports:
      - "${WG_ADRES:-10.67.0.2}:8200:8200"
    networks: [bron]

networks:
  bron:
    # Vast subnet, zodat pg_hba.conf de werkbank kan toelaten.
    ipam:
      config:
        - subnet: 172.30.67.0/24

volumes:
  bronpg:
  testdata:
  baodata:
  baologs:

# Garage voor de proef: één node, geen replicatie. Zelfde opzet als dg-documenten
# in het gemeenschapsplatform. Het RPC-geheim, de sleutel en de bucket komen uit
# de omgeving (compose.yml); hier staat niets geheims.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"

# Het datawarehouse: dataproducten in PostgreSQL met PostGIS, alleen-lezen.
# Geometrie kent de connector niet; die komt als tekst (hex-WKB) mee, of het
# dataproduct levert een eigen kolom met WKT.
connector.name=postgresql
connection-url=jdbc:postgresql://db:5432/dwh
connection-user=dwh_lezer
connection-password=${ENV:DWH_LEZER_WACHTWOORD}
unsupported-type-handling=CONVERT_TO_VARCHAR

# Het lakehouse: Iceberg via Lakekeeper, op Garage. Trino heeft een sleutel die
# alleen mag lezen (DF-ADR-002, DF-ADR-008).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=datafundament
iceberg.rest-catalog.vended-credentials-enabled=false
# Inloggen bij Lakekeeper met een token van Keycloak, als df-lk-trino: alleen lezen (DF-ADR-019).
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=df-lk-trino:${ENV:LK_TRINO_GEHEIM}
iceberg.rest-catalog.oauth2.scope=lakekeeper
iceberg.rest-catalog.oauth2.server-uri=https://id.${ENV:DOMEIN}/realms/datafundament/protocol/openid-connect/token
fs.native-s3.enabled=true
s3.endpoint=http://garage:3900
s3.region=garage
s3.path-style-access=true
s3.aws-access-key=${ENV:GARAGE_LEZER_SLEUTEL}
s3.aws-secret-key=${ENV:GARAGE_LEZER_GEHEIM}
